<!DOCTYPE html>
<html lang="zh-CN">
<!-- 根标签：整个HTML文档的容器 -->
<head>
    <meta charset="UTF-8"> <!-- 字符编码，避免乱码核心配置 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- 适配移动端 -->
    <title>HTML常用标签示例</title> <!-- 页面标题，显示在浏览器标签栏 -->
</head>
<body>
    <!-- 一、结构/标题标签：定义页面层级 -->
    <h1>1级标题（最大）</h1>
    <h2>2级标题</h2>
    <h6>6级标题（最小）</h6>

    <!-- 二、文本标签：格式化文本 -->
    <p>这是一个段落标签（p），自动换行，自带上下间距</p>
    <br> <!-- 换行符（无闭合标签） -->
    <strong>加粗文本（strong，强调语义）</strong>
    <em>斜体文本（em，强调语义）</em>
    <span>行内文本容器（span），不独占一行</span>
    <div>块级容器（div），独占一行，常用作布局</div>
    <hr> <!-- 水平线（无闭合标签） -->

    <!-- 三、列表标签 -->
    <h3>无序列表</h3>
    <ul>
        <li>列表项1</li>
        <li>列表项2</li>
    </ul>
    <h3>有序列表</h3>
    <ol>
        <li>有序项1</li>
        <li>有序项2</li>
    </ol>

    <!-- 四、链接/多媒体标签 -->
    <a href="https://www.baidu.com" target="_blank">百度链接（target="_blank"新窗口打开）</a>
    <img src="https://picsum.photos/200/100" alt="示例图片" title="鼠标悬浮提示"> <!-- 图片标签，alt为图片加载失败时的替代文本 -->
    <audio src="demo.mp3" controls>你的浏览器不支持音频播放</audio> <!-- 音频标签，controls显示播放控件 -->
    <video src="demo.mp4" width="300" controls>你的浏览器不支持视频播放</video>

    <!-- 五、表单标签：用于用户交互 -->
    <form action="/submit" method="post">
        <label for="username">用户名：</label>
        <input type="text" id="username" name="username" placeholder="请输入用户名"><br>
        
        <label for="pwd">密码：</label>
        <input type="password" id="pwd" name="pwd"><br>
        
        <input type="radio" name="gender" id="male" value="male">
        <label for="male">男</label>
        <input type="radio" name="gender" id="female" value="female">
        <label for="female">女</label><br>
        
        <input type="checkbox" name="hobby" id="read" value="read">
        <label for="read">阅读</label>
        <input type="checkbox" name="hobby" id="sport" value="sport">
        <label for="sport">运动</label><br>
        
        <button type="submit">提交</button>
        <button type="reset">重置</button>
    </form>

    <!-- 六、表格标签 -->
    <table border="1" cellpadding="5" cellspacing="0">
        <tr> <!-- 行 -->
            <th>表头1</th> <!-- 表头单元格 -->
            <th>表头2</th>
        </tr>
        <tr>
            <td>内容1</td> <!-- 普通单元格 -->
            <td>内容2</td>
        </tr>
    </table>
</body>
</html>
